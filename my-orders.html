<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Orders | Giftopia</title>
    <link rel="stylesheet" href="assets/css/styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
</head>

<body>
    <div id="header-component"></div>

    <main class="section">
        <div class="container">
            <div class="page-header">
                <h1>My Orders</h1>
                <div class="order-stats">
                    <div class="stat">
                        <span class="stat-number" id="total-orders">0</span>
                        <span class="stat-label">Total Orders</span>
                    </div>
                    <div class="stat">
                        <span class="stat-number" id="pending-orders">0</span>
                        <span class="stat-label">Pending</span>
                    </div>
                    <div class="stat">
                        <span class="stat-number" id="delivered-orders">0</span>
                        <span class="stat-label">Delivered</span>
                    </div>
                </div>
            </div>

            <!-- Orders Filter -->
            <div class="orders-filter">
                <button class="filter-btn active" data-filter="all">All Orders</button>
                <button class="filter-btn" data-filter="pending">Pending</button>
                <button class="filter-btn" data-filter="processing">Processing</button>
                <button class="filter-btn" data-filter="shipped">Shipped</button>
                <button class="filter-btn" data-filter="delivered">Delivered</button>
                <button class="filter-btn" data-filter="cancelled">Cancelled</button>
            </div>

            <!-- Orders List -->
            <div id="orders-container">
                <div class="loading">Loading your orders...</div>
            </div>

            <!-- No Orders Message -->
            <div id="no-orders" class="no-orders" style="display: none;">
                <div class="empty-state">
                    <div class="empty-icon">📦</div>
                    <h2>No Orders Yet</h2>
                    <p>You haven't placed any orders. Start shopping to see your orders here.</p>
                    <a href="products.html" class="btn primary">Start Shopping</a>
                </div>
            </div>

            <!-- Order Details Modal -->
            <div id="order-details-modal" class="modal">
                <div class="modal-content">
                    <div class="modal-header">
                        <h2>Order Details</h2>
                        <button class="close-modal">&times;</button>
                    </div>
                    <div class="modal-body">
                        <!-- Order details will be loaded here -->
                    </div>
                </div>
            </div>
        </div>
    </main>

    <div id="footer-component"></div>

    <script src="assets/js/auth.js"></script>
    <script src="assets/js/main.js"></script>

    <!-- Component Loader Script -->
    <script>
        async function loadComponent(componentId, componentPath) {
            try {
                const response = await fetch(componentPath);
                if (!response.ok) throw new Error(`Failed to load ${componentPath}`);
                const html = await response.text();
                document.getElementById(componentId).innerHTML = html;

                if (componentId === 'header-component' && window.auth) {
                    auth.updateHeaderUI();
                    const logoutBtn = document.getElementById('logout-btn');
                    if (logoutBtn) {
                        logoutBtn.addEventListener('click', function (e) {
                            e.preventDefault();
                            if (window.auth && typeof window.auth.logout === 'function') {
                                window.auth.logout();
                            } else if (typeof logout === 'function') {
                                logout();
                            }
                        });
                    }
                    if (typeof updateCartCount === 'function') {
                        updateCartCount();
                    }
                }
            } catch (error) {
                console.error(`Error loading component ${componentPath}:`, error);
            }
        }

        document.addEventListener('DOMContentLoaded', async function () {
            await loadComponent('header-component', 'components/header.html');
            await loadComponent('footer-component', 'components/footer.html');
        });
    </script>

    <script src="assets/js/orders.js"></script>
</body>

</html>
