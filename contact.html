<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Giftopia | Contact Us</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/styles.css">
  <link rel="icon" type="image/png" href="01.png">
</head>

<body>
  <div id="header-component"></div>

  <main class="section">
    <div class="container">
      <div class="section-head">
        <h1>Contact us</h1>
        <span class="muted">We'd love to hear from you</span>
      </div>

      <div class="with-sidebar" style="grid-template-columns: 1fr 1fr;">
        <section class="card" style="padding:16px;">
          <h2 style="margin-top:0;">Send a message</h2>
          <form class="auth-form" action="#" method="post">
            <div class="form-row two">
              <div>
                <label for="cname">Full name</label>
                <input id="cname" type="text" placeholder="Your name" required>
              </div>
              <div>
                <label for="cphone">Phone</label>
                <input id="cphone" type="tel" placeholder="(+94) 712345678">
              </div>
            </div>
            <div class="form-row">
              <label for="cemail">Email</label>
              <input id="cemail" type="email" placeholder="you@example.com" required>
            </div>
            <div class="form-row">
              <label for="cmsg">Message</label>
              <textarea id="cmsg" rows="5" placeholder="How can we help?" required></textarea>
            </div>
            <div class="form-row">
              <button class="btn primary" type="submit">Send message</button>
            </div>
          </form>
        </section>

        <aside class="card" style="padding:16px;">
          <h2 style="margin-top:0;">Contact details</h2>
          <div class="dummy_text"><img src="assets/images/map-icon.png" alt="Map"><span class="address_text">Address :
              419/5 Piyathissa Mawatha, Kadawatha</span></div>
          <div class="call_text"><img src="assets/images/call-icon.png" alt="Phone"><span class="address_text">Phone :
              +(94)713242657</span></div>
          <div class="call_text"><img src="assets/images/email-icon.png" alt="Email"><span class="address_text">Email :
              giftopia@gmail.com</span></div>
        </aside>
      </div>
    </div>
  </main>

  <div id="footer-component"></div>

  <!-- Load auth.js first so it's available for components -->
  <script src="assets/js/auth.js"></script>

  <!-- Component Loader Script -->
  <script>
    // Function to load component HTML
    async function loadComponent(componentId, componentPath) {
      try {
        const response = await fetch(componentPath);
        if (!response.ok) {
          throw new Error(`Failed to load ${componentPath}`);
        }
        const html = await response.text();
        document.getElementById(componentId).innerHTML = html;

        // After header loads, update authentication UI
        if (componentId === 'header-component' && window.auth) {
          auth.updateHeaderUI();

          // Attach logout button event listener
          const logoutBtn = document.getElementById('logout-btn');
          if (logoutBtn) {
            logoutBtn.addEventListener('click', function (e) {
              e.preventDefault();
              if (window.auth && typeof window.auth.logout === 'function') {
                window.auth.logout();
              } else if (typeof logout === 'function') {
                logout();
              }
            });
          }
        }
      } catch (error) {
        console.error(`Error loading component ${componentPath}:`, error);
      }
    }

    // Load all components when DOM is ready
    document.addEventListener('DOMContentLoaded', async function () {
      await loadComponent('header-component', 'components/header.html');
      await loadComponent('footer-component', 'components/footer.html');
    });
  </script>
  <script src="assets/js/main.js"></script>
</body>

</html>
